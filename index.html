<style>

h+=`<input id="sq" placeholder="Buscar invitado" value="${esc(pq)}" style="margin-bottom:10px"><div class="chips">${[['ALL','Todos ('+G.length+')'],['SI','Van ('+si.length+')'],['NO','No van ('+no.length+')'],['AC','Acompañantes']].map(a=>`<button data-f="${a[0]}" class="${pf===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>`+(list.map(x=>`<div class="gi ${x.visto?'':'new'}"><div style="display:flex;justify-content:space-between"><b>${esc(x.nombre)}</b><span class="mut">#${esc(x.num)}</span></div><span class="tag ${x.asistencia==='NO'?'n':''}">${x.asistencia==='SI'?'VA':'NO VA'}</span>${x.tipo==='ACOMPAÑANTE'?`<span class="tag">ACOMPAÑANTE DE ${esc(nm(x.acompanaDe))}</span>`:''}${x.visto?'':'<span class="tag">NUEVO</span>'}${x.cancion?`<p class="mut" style="margin-top:8px">♪ ${esc(x.cancion)}</p><a class="btn g" style="min-height:46px;margin-top:8px" href="https://open.spotify.com/search/${encodeURIComponent(x.cancion)}" target="_blank" rel="noopener">${I.spo}Buscar en Spotify</a>`:''}${x.mensaje?`<p style="margin-top:10px;font:italic 400 18px var(--serif)">“${esc(x.mensaje)}”</p>`:''}${x.tipo==='ACOMPAÑANTE'?'':`<button class="btn r" data-d="${esc(x.id)}" style="min-height:44px;margin-top:10px">Eliminar</button>`}</div>`).join('')||'<p class="mut">Sin resultados.</p>')}
if(pt==='lis')h+=`<div class="card" style="margin-bottom:14px"><label>Agregar a la lista (uno por línea)</label><textarea id="an" rows="3" placeholder="Nombre y apellido"></textarea><button class="btn" id="aa">Agregar</button></div><p class="mut" style="margin-bottom:10px">${L.filter(x=>x.estado==='SI').length} confirmados · ${L.filter(x=>!x.estado).length} pendientes (tachados = ya confirmaron)</p>`+L.map(x=>`<div class="gi ${x.estado==='SI'?'done':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(x.nombre)}</b><span class="tag ${x.estado==='NO'?'n':''}" style="margin:0">${x.estado==='SI'?'CONFIRMÓ':x.estado==='NO'?'NO VA':'PENDIENTE'}</span></div>${x.estado?'':`<button class="btn r" data-ld="${esc(x.nombre)}" style="min-height:40px;margin-top:10px;font-size:11px">Quitar</button>`}</div>`).join('');
if(pt==='alb')h+=`<div class="pgrid">${PD.photos.map(p=>`<div class="gi"><img src="${src(p.fileId)}" loading="lazy" alt=""><p style="margin-top:6px;font-size:14px"><b style="font-weight:500">${esc(p.nombre)}</b> · ${Object.values(p.rx).reduce((a,b)=>a+b,0)} reacc.</p>${p.comentario?`<p class="mut" style="font-size:13px">${esc(p.comentario)}</p>`:''}<button class="btn r" data-x="${p.pid}" style="min-height:40px;margin-top:8px;font-size:11px">Eliminar</button></div>`).join('')||'<p class="mut">Aún no hay fotos.</p>'}</div>`;
$('#ap').innerHTML=h;
$$('[data-t]').forEach(b=>b.onclick=()=>{pt=b.dataset.t;draw()});$$('[data-f]').forEach(b=>b.onclick=()=>{pf=b.dataset.f;draw()});
const q=$('#sq');if(q)q.oninput=e=>{pq=e.target.value.toLowerCase();draw();const s=$('#sq');s.focus();s.setSelectionRange(99,99)};
$$('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este invitado (y su acompañante)? Su nombre vuelve a quedar libre en la lista.'))return;b.disabled=true;await api({action:'deleteGuest',pin:PD.pin,id:b.dataset.d}).catch(()=>{});load(PD.pin)});
$$('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta foto del álbum?'))return;b.disabled=true;await api({action:'deletePhoto',pin:PD.pin,pid:b.dataset.x}).catch(()=>{});PD.photos=PD.photos.filter(x=>x.pid!==b.dataset.x);draw()});
$$('[data-ld]').forEach(b=>b.onclick=async()=>{b.disabled=true;await api({action:'delList',pin:PD.pin,nombre:b.dataset.ld}).catch(()=>{});load(PD.pin)});
const aa=$('#aa');if(aa)aa.onclick=async()=>{const n=$('#an').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n.length)return;aa.disabled=true;aa.textContent='Agregando…';await api({action:'addList',pin:PD.pin,names:n}).catch(()=>{});load(PD.pin)};
const nw=G.filter(x=>!x.visto).map(x=>x.id);if(nw.length&&pt==='inv')setTimeout(()=>api({action:'markSeen',pin:PD.pin,ids:nw}).catch(()=>{}),5000)}
if(isAdmin){$('#intro').remove();document.body.classList.add('go');admin()}else{guest();intro().then(()=>setTimeout(reveal,50))}
</script></body></html>
