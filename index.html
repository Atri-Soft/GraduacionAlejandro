function prep(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,2560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);if(!b)return no();const f=new FileReader();f.onload=()=>ok(f.result.split(',')[1]);f.readAsDataURL(b)},'image/jpeg',.9)};im.onerror=no;im.src=u})}
function upSheet(){let file=null;const m=document.createElement('div');m.className='md';
m.innerHTML=`<div class="sheet"><div class="lb" style="margin-bottom:14px">Nueva foto</div><input type="file" id="uf" accept="image/*" hidden><div id="pv"><button class="btn g" id="pk">${I.img}Elegir foto</button></div><label style="margin-top:18px">Comentario (opcional)</label><textarea id="uc" rows="2" maxlength="200"></textarea><p class="mut" style="margin-bottom:16px;font-size:14px">Tu foto será visible para todos los invitados junto a tu nombre y tu comentario.</p><button class="btn" id="up">Publicar</button><button class="btn g" id="uk">Cancelar</button><p class="err" id="ue"></p></div>`;
document.body.appendChild(m);document.body.classList.add('lock');const cl=()=>{m.remove();document.body.classList.remove('lock')};
m.onclick=e=>{if(e.target===m)cl()};$('#uk').onclick=cl;$('#pk').onclick=()=>$('#uf').click();
$('#uf').onchange=e=>{file=e.target.files[0];if(!file)return;$('#pv').innerHTML=`<img class="pv" src="${URL.createObjectURL(file)}" alt="">`;}
$('#up').onclick=async()=>{const er=$('#ue'),b=$('#up');if(!file)return er.textContent='Elige una foto primero.';b.disabled=true;b.textContent='Subiendo en alta calidad…';er.textContent='';
try{const data=await prep(file),r=await api({action:'upload',id:me.id,comentario:$('#uc').value.trim(),data,mime:'image/jpeg'});if(!r||!r.ok)throw 0;cl();boom(innerWidth/2,innerHeight*.6,70);albRender.s='';loadAlb()}catch(x){b.disabled=false;b.textContent='Publicar';er.textContent='No se pudo subir. Revisa tu conexión e intenta otra vez.'}}}
/* ===== PANEL ALEJANDRO ===== */
let PD=null,pt='res',pf='ALL',pq='';
function admin(){document.title='Panel · Alejandro';$('#app').innerHTML=`<div style="padding-top:34px"><div class="eb" style="text-align:center">Panel privado</div><h2 class="gt" style="text-align:center">Alejandro</h2><div id="ap"></div></div>`;const pin=ls('apin');if(!pin){$('#ap').innerHTML=`<div class="card"><label>PIN de acceso</label><input id="pi" type="password" inputmode="numeric" maxlength="12"><button class="btn" id="pb">Entrar</button><p class="err" id="pe"></p></div>`;$('#pb').onclick=()=>load($('#pi').value.trim());return}load(pin)}
async function load(pin){if(!OK){$('#ap').innerHTML='<p class="mut">Configura la URL del script.</p>';return}try{const r=await get('?action=panel&pin='+encodeURIComponent(pin));if(!r.ok){ls('apin',null);if(!$('#pb'))return admin();return $('#pe').textContent='PIN incorrecto.'}ls('apin',pin);PD={guests:r.guests,photos:r.photos,pin};draw();if(!admin.t)admin.t=setInterval(poll,12000)}catch(e){$('#ap').innerHTML='<p class="mut">Error de conexión.</p>'}}
async function poll(){if(!PD||document.hidden||document.activeElement&&document.activeElement.id==='sq')return;try{const r=await get('?action=panel&pin='+encodeURIComponent(PD.pin));if(!r.ok)return;if(JSON.stringify([r.guests,r.photos])===JSON.stringify([PD.guests,PD.photos]))return;PD.guests=r.guests;PD.photos=r.photos;draw()}catch(e){}}
function draw(){const G=PD.guests,si=G.filter(x=>x.asistencia==='SI'),no=G.filter(x=>x.asistencia==='NO'),tot=G.length||1,L=2*Math.PI*40,fr=si.length/tot;
const by={};si.forEach(x=>{const k=String(x.fecha).slice(0,10);by[k]=(by[k]||0)+1});const ks=Object.keys(by).sort().slice(-7),mx=Math.max(1,...ks.map(k=>by[k]));
let h=`<div class="tabs">${[['res','Resumen'],['inv','Invitados'],['alb','Álbum']].map(a=>`<button data-t="${a[0]}" class="${pt===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>`;
if(pt==='res')h+=`<div class="met"><div><b>${si.length}</b><span>Confirmados</span></div><div><b>${no.length}</b><span>No asisten</span></div><div><b>${G.length}</b><span>Respuestas</span></div><div><b>${PD.photos.length}</b><span>Fotos</span></div></div>
<div class="card" style="display:flex;gap:20px;align-items:center;margin-bottom:12px"><svg viewBox="0 0 100 100" width="120" height="120" style="transform:rotate(-90deg);flex:none"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="#e9c46a" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(L*fr).toFixed(1)} ${L.toFixed(1)}"/></svg><div><div class="lb">Asistencia</div><b class="gt" style="font:italic 600 40px var(--serif)">${Math.round(fr*100)}%</b><p class="mut">dicen que sí</p></div></div>
<div class="card"><div class="lb" style="margin-bottom:14px">Confirmaciones por día</div><div class="bars">${ks.map(k=>`<div><i style="height:${by[k]/mx*80}px"></i>${by[k]}<br>${k.slice(5)}</div>`).join('')||'<span class="mut">Sin datos aún</span>'}</div></div>`;
if(pt==='inv'){const f={ALL:()=>1,SI:x=>x.asistencia==='SI',NO:x=>x.asistencia==='NO'},list=G.filter(x=>f[pf](x)&&x.nombre.toLowerCase().includes(pq));
h+=`<input id="sq" placeholder="Buscar invitado" value="${esc(pq)}" style="margin-bottom:10px"><div class="chips">${[['ALL','Todos ('+G.length+')'],['SI','Van ('+si.length+')'],['NO','No van ('+no.length+')']].map(a=>`<button data-f="${a[0]}" class="${pf===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>`+(list.map(x=>`<div class="gi ${x.visto?'':'new'}"><div style="display:flex;justify-content:space-between"><b>${esc(x.nombre)}</b><span class="mut">#${esc(x.num)}</span></div><span class="tag ${x.asistencia==='NO'?'n':''}">${x.asistencia==='SI'?'VA':'NO VA'}</span>${x.visto?'':'<span class="tag">NUEVO</span>'}${x.cancion?`<p class="mut" style="margin-top:8px">♪ ${esc(x.cancion)}</p><a class="btn g" style="min-height:46px;margin-top:8px" href="https://open.spotify.com/search/${encodeURIComponent(x.cancion)}" target="_blank" rel="noopener">${I.spo}Buscar en Spotify</a>`:''}${x.mensaje?`<p style="margin-top:10px;font:italic 400 18px var(--serif)">“${esc(x.mensaje)}”</p>`:''}<button class="btn r" data-d="${esc(x.id)}" style="min-height:44px;margin-top:10px">Eliminar</button></div>`).join('')||'<p class="mut">Sin resultados.</p>')}
if(pt==='alb')h+=`<div class="pgrid">${PD.photos.map(p=>`<div class="gi"><img src="${src(p.fileId)}" loading="lazy" alt=""><p style="margin-top:6px;font-size:14px"><b style="font-weight:500">${esc(p.nombre)}</b> · ${p.likes} ♥</p>${p.comentario?`<p class="mut" style="font-size:13px">${esc(p.comentario)}</p>`:''}<button class="btn r" data-x="${p.pid}" style="min-height:40px;margin-top:8px;font-size:11px">Eliminar</button></div>`).join('')||'<p class="mut">Aún no hay fotos.</p>'}</div>`;
$('#ap').innerHTML=h;
$$('[data-t]').forEach(b=>b.onclick=()=>{pt=b.dataset.t;draw()});$$('[data-f]').forEach(b=>b.onclick=()=>{pf=b.dataset.f;draw()});
const q=$('#sq');if(q)q.oninput=e=>{pq=e.target.value.toLowerCase();draw();const s=$('#sq');s.focus();s.setSelectionRange(99,99)};
$$('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este invitado? No se puede deshacer.'))return;await api({action:'deleteGuest',pin:PD.pin,id:b.dataset.d}).catch(()=>{});PD.guests=PD.guests.filter(x=>x.id!==b.dataset.d);draw()});
$$('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta foto del álbum?'))return;b.disabled=true;await api({action:'deletePhoto',pin:PD.pin,pid:b.dataset.x}).catch(()=>{});PD.photos=PD.photos.filter(x=>x.pid!==b.dataset.x);draw()});
const nw=G.filter(x=>!x.visto).map(x=>x.id);if(nw.length&&pt==='inv')setTimeout(()=>api({action:'markSeen',pin:PD.pin,ids:nw}).catch(()=>{}),5000)}
if(isAdmin){$('#intro').remove();document.body.classList.add('go');admin()}else{guest();intro().then(()=>setTimeout(reveal,50))}
</script></body></html>
